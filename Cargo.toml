[package]
name = "ubus"
version = "0.99.0"
authors = ["James Lee <jbit@jbit.net>", "Kshava Lewis <knightmare1980@gmail.com>"]
edition = "2024"
description = "OpenWrt ubus client and service library in pure Rust"
repository = "https://github.com/shavac/ubus-rs"
keywords = ["embedded", "openwrt"]
categories = ["embedded", "os", "os::linux-apis","api-bindings"]
license = "BSD-2-Clause"

[features]
default = ["json"]
json = ["dep:serde_json"]
no_std = []

[dependencies]
serde = { version = "1.0.193", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.108", optional = true }
thiserror = "1.0.52"

[[example]]
name = "invoke"
required-features = ["json"]

[[example]]
name = "ubuscall"
required-features = ["json"]

[profile.release]
panic = 'abort'
opt-level = 'z' # Optimize for size.
lto = true      # Enable link time optimization.
strip = true
codegen-units = 1

